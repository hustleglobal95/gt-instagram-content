name: GT Studio Carousel (1x/day)

# Publishes the next approved Growth Terminal carousel to @markusreidgt on Instagram.
# The only source is studio_carousels.json (owner approved, 29 Sep 2026). Each
# carousel posts once, in order; there is no loop, and when the list is done the
# job posts nothing. Instagram only: no Facebook, no Threads.
#
# 16:45 UTC is 12:45pm in Florida while it is on EDT (11:45am after Nov 2 2026).
# The minute is off :00 on purpose, where GitHub drops scheduled runs.

on:
  schedule:
    - cron: '45 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gt-studio-carousel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Validate curated marketing queue
        run: python studio_queue_validate.py

      - name: Publish the next approved carousel
        env:
          GT_IG_USER_ID:      ${{ secrets.GT_IG_USER_ID }}
          GT_IG_ACCESS_TOKEN: ${{ secrets.GT_IG_ACCESS_TOKEN }}
          GT_GITHUB_REPO:     ${{ github.repository }}
          GT_API_BASE:        ${{ secrets.GT_API_BASE }}
          GT_DRY_RUN:         ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python studio_carousel_post.py

      - name: Record what was posted
        run: |
          git config user.name  "gt-studio-carousel[bot]"
          git config user.email "gt-studio-carousel@users.noreply.github.com"
          git add studio_carousels_used.json posted_log.json
          if git diff --staged --quiet; then echo "nothing to record"; exit 0; fi
          git commit -m "studio carousel: posted record $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "Could not push the used record. Fix before the next run or the same carousel posts again."
          exit 1
