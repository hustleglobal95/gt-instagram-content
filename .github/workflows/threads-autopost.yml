# .github/workflows/threads-autopost.yml
# Growth Terminal — Threads auto-poster. Mirrors autopost.yml (Instagram).
# Place this file at .github/workflows/ in the SAME repo as generate.js, and put
# the threads_*.js files at the repo root so logs land where the dashboard reads them.

name: Threads Auto-Poster

on:
  schedule:
    # 3x/day. Was 12.
    #
    # Twelve posts a day split the velocity window twelve ways. The first 30 to
    # 60 minutes after a post decide its distribution, and the account cannot be
    # present for twelve of those windows, so most posts were landing with no
    # early engagement and teaching the algorithm that this account produces
    # content nobody responds to. Median reach across 78 posts: 14 views.
    #
    # Every source lands on 2 to 3 a day. These three sit in the researched
    # windows: 6 to 8 AM and 7 to 9 PM are peak, with one at midday.
    #
    # Minutes are deliberately off :00, where every cron on the platform wakes
    # at once and GitHub starts dropping runs.
    #
    # When Florida switches to EST (UTC-5) on Nov 2 2026, add 1 hour to each.
    - cron: "8 11 * * *"     # 7:08am ET, morning window
    - cron: "38 16 * * *"    # 12:38pm ET, midday
    - cron: "18 23 * * *"    # 7:18pm ET, evening window

  workflow_dispatch: {}   # the dashboard "Post one now" button hits this

permissions:
  contents: write         # to commit the updated logs

concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish next Threads post
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}   # JSON array of {name,userId,token}
          GT_DRY_RUN: ${{ vars.GT_DRY_RUN }}                  # set to 1 to pause (generates + logs, no publish)
        run: node threads_post_now.js

      - name: Commit logs
        run: |
          git config user.name "gt-threads-bot"
          git config user.email "bot@growthterminal.local"
          git add threads_posted_log.json threads_used_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "threads: publish + log [skip ci]"
          git push
