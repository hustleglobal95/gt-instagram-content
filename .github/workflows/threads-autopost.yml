# .github/workflows/threads-autopost.yml
# Growth Terminal — Threads auto-poster. Mirrors autopost.yml (Instagram).
# Place this file at .github/workflows/ in the SAME repo as generate.js, and put
# the threads_*.js files at the repo root so logs land where the dashboard reads them.

name: Threads Auto-Poster

on:
  schedule:
    # 6x/day.
    #
    # History: was 12, which split the velocity window twelve ways. The first 30
    # to 60 minutes after a post decide its distribution, and nobody can be
    # present for twelve of those a day, so most posts landed with no early
    # engagement. Median reach across 78 posts at that cadence: 14 views.
    #
    # Six is the deliberate middle. Two land in each researched peak window
    # (6 to 8 AM and 7 to 9 PM), two cover the daytime. The tightest gap is 90
    # minutes, which clears the 30 to 60 minute velocity window, so no post is
    # competing with the account's own previous post for early replies.
    #
    # The bank supports it: 149 days of unique posts at six a day before the
    # no-repeat log runs dry, no repeated post and no repeated opening line.
    #
    # Minutes are deliberately off :00, where every cron on the platform wakes
    # at once and GitHub starts dropping runs.
    #
    # When Florida switches to EST (UTC-5) on Nov 2 2026, add 1 hour to each.
    - cron: "48 10 * * *"    # 6:48am ET, morning window
    - cron: "18 12 * * *"    # 8:18am ET, morning window
    - cron: "38 15 * * *"    # 11:38am ET, late morning
    - cron: "8 18 * * *"     # 2:08pm ET, afternoon
    - cron: "38 22 * * *"    # 6:38pm ET, evening window
    - cron: "28 0 * * *"     # 8:28pm ET, evening window

  workflow_dispatch: {}   # the dashboard "Post one now" button hits this

permissions:
  contents: write         # to commit the updated logs

concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish next Threads post
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}   # JSON array of {name,userId,token}
          GT_DRY_RUN: ${{ vars.GT_DRY_RUN }}                  # set to 1 to pause (generates + logs, no publish)
        run: node threads_post_now.js

      - name: Commit logs
        run: |
          git config user.name "gt-threads-bot"
          git config user.email "bot@growthterminal.local"
          git add threads_posted_log.json threads_used_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "threads: publish + log [skip ci]"
          git push
