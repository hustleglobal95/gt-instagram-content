name: GT Auto-Post (4x/day)

# Posts 4 times a day. Triggered externally by cron-job.org at the exact Florida
# times (9am, 1pm, 5pm, 9pm ET, DST handled), which calls this workflow via the
# GitHub API. No internal schedule — cron-job.org is the sole trigger.
on:
  workflow_dispatch:        # fired by cron-job.org (and lets you run it by hand)
    inputs:
      mode:
        description: "What to post. auto keeps the normal dice roll."
        required: false
        default: auto
        type: choice
        options: [auto, reel, static, product]

# Don't let two runs overlap (they both push to the repo).
concurrency:
  group: gt-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install ffmpeg (for Reels)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install requests

      - name: Generate a fresh creative
        run: node generate.js

      - name: Screen creative for AI slop
        # Vision-model quality gate: blocks AI slop before anything is committed or posted.
        # Needs a vision key (set OPENAI_API_KEY or ANTHROPIC_API_KEY in repo Secrets).
        # Fail-open by default: with no key / API down it allows the post (set GUARD_FAIL_CLOSED=1 to flip).
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # SLOP_STRICT_AI: "0"       # "1" also blocks anything that merely looks AI-generated
          # SLOP_MIN_QUALITY: "55"
          # GUARD_FAIL_CLOSED: "0"    # "1" refuses to post when the check can't run
        run: |
          IMG=$(ls -t creatives/*.jpg creatives/*.jpeg creatives/*.png creatives/*.webp 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then echo "No image creative to screen; skipping."; exit 0; fi
          if [ -z "$(find "$IMG" -mmin -10)" ]; then echo "Newest image isn't fresh (video Reel run?); skipping."; exit 0; fi
          echo "Screening $IMG for AI slop..."
          node slop-guard.js "$IMG"

      - name: Commit the new creative (so its image URL is public)
        run: |
          git config user.name  "gt-autopost[bot]"
          git config user.email "gt-autopost@users.noreply.github.com"
          git add creatives meta.json used_log.json
          git commit -m "auto: new creative $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

      - name: Publish to Instagram + Facebook
        env:
          GT_IG_USER_ID:          ${{ secrets.GT_IG_USER_ID }}
          GT_IG_ACCESS_TOKEN:     ${{ secrets.GT_IG_ACCESS_TOKEN }}
          GT_GITHUB_REPO:         ${{ secrets.GT_GITHUB_REPO }}
          GT_GITHUB_BRANCH:       ${{ github.ref_name }}
          GT_API_BASE:            ${{ secrets.GT_API_BASE }}
          GT_FORCE_MODE:          ${{ inputs.mode }}
          GT_DRY_RUN:             ${{ secrets.GT_DRY_RUN }}
          # Facebook Page (leave unset to skip FB posting)
          GT_FB_PAGE_ID:          ${{ secrets.GT_FB_PAGE_ID }}
          GT_FB_PAGE_ACCESS_TOKEN: ${{ secrets.GT_FB_PAGE_ACCESS_TOKEN }}
        run: python post_now.py

      - name: Commit the posting record
        if: always()
        run: |
          git config user.name  "gt-autopost[bot]"
          git config user.email "gt-autopost@users.noreply.github.com"
          git add posted_log.json || true
          git commit -m "auto: posted record $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push || true
